[workspace]
resolver = "2"
members = [
    "hello_world",
    "basic_led",
]

[workspace.dependencies]
esp-hal                = { version = "1.0.0-rc.1", features = ["esp32c3", "unstable"] }
esp-println            = { version = "0.15.0",    features = ["esp32c3"] }
esp-backtrace          = { version = "0.17.0",    features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0",     features = ["esp32c3"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units   = 1
debug           = 2
incremental     = false
lto             = "fat"
opt-level       = "s"
overflow-checks = false